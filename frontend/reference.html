<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fashion Store</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="logo">F <span>FASHION</span></div>
    <nav>
      <a href="#">CATALOGUE</a>
      <a href="#">FASHION</a>
      <a href="#">FAVOURITE</a>
      <a href="#">LIFESTYLE</a>
    </nav>
    <button class="signup-btn">SIGN UP</button>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-text">
      <h1>
        LET’S <br>
        <span class="highlight">EXPLORE</span> <br>
        <span class="highlight yellow">UNIQUE</span><br>
        CLOTHES.
      </h1>
      <p>Live for Influential and Innovative fashion!</p>
      <button class="shop-btn">Shop Now</button>
    </div>

    <div class="hero-img">
      <img src="images/fa-girl.jpg" alt="Fashion Model">
    </div>
  </section>

</body>
</html>
