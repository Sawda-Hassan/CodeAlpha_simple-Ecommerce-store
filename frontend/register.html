<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Fashion Store</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
 <header class="navbar">
    <div class="logo">FATUSH <span>STYLES</span></div>
    <nav>
      <a href="index.html">HOME</a>
      <a href="products.html">PRODUCTS</a>
      <a href="about.html">ABOUT</a>
      <a href="contact.html">CONTACT US</a>
    </nav>
    <button class="signup-btn" onclick="location.href='register.html'">SIGN UP</button>
     <button class="login-btn" onclick="location.href='login.html'">LOGIN</button>

    <a href="cart.html" class="cart-link">🛒 Cart (<span id="cart-count">0</span>)</a>
  </header>
  <section class="auth-section">
    <div class="auth-container">
      <h2>Create Your Account</h2>
      <form class="auth-form" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="name">Full Name</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" required>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" required>
        </div>
        <button type="submit" class="auth-btn">Create Account</button>
      </form>
      <p class="auth-link">Already have an account? <a href="login.html">Login here</a></p>
    </div>
  </section>

  <script src="auth.js"></script>
</body>
</html>
