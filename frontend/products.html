<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Products - FATUSH STYLES</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
   <!-- Navbar -->
   <header class="navbar">
    <div class="logo">FATUSH <span>STYLES</span></div>
    <nav>
      <a href="index.html">HOME</a>
      <a href="products.html">PRODUCTS</a>
      <a href="about.html">ABOUT</a>
      <a href="contact.html">CONTACT US</a>
    </nav>
    <button class="signup-btn" onclick="location.href='register.html'">SIGN UP</button>
     <button class="login-btn" onclick="location.href='login.html'">LOGIN</button>

    <a href="cart.html" class="cart-link">🛒 Cart (<span id="cart-count">0</span>)</a>
  </header>

  <main>
    <section class="all-products">
      <h2>All Products</h2>
      <div class="products-grid" id="products-grid"></div>
    </section>
  </main>

  <script>
    const products = [
      { title: "Hoodies & Sweatshirt", price: 45.99, img: "images/fa-a.png" },
      { title: "Coats & Parkas", price: 89.99, img: "images/fa-p.jpg" },
      { title: "Tees & T-Shirt", price: 24.99, img: "images/fa-g.jpg" },
      { title: "Elegant Dresses", price: 79.99, img: "images/fa-u.jpg" },
      { title: "Denim & Jeans", price: 59.99, img: "images/fa-i.jpg" },
      { title: "Leather Jackets", price: 129.99, img: "images/fa-h.jpg" },
      { title: "Summer Shorts", price: 34.99, img: "images/fa-r.jpg" }
    ];

    const grid = document.getElementById('products-grid');
    products.forEach((product, index) => {
      const card = document.createElement('div');
      card.classList.add('product-card');
      card.innerHTML = `
        <div class="product-image">
          <img src="${product.img}" alt="${product.title}">
        </div>
        <div class="product-info">
          <h3>${product.title}</h3>
          <p class="product-price">$${product.price}</p>
          <button onclick="location.href='product.html?id=${index}'">Explore Now!</button>
        </div>
      `;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
